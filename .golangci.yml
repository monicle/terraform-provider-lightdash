# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"
run:
  # Explicit target — trunk pins golangci-lint2 built with Go 1.25, which
  # otherwise refuses to load a go.mod that declares `go 1.26.0` (see
  # https://github.com/golangci/golangci-lint/issues/6001). The fork bumped
  # go.mod to 1.26.0 for stdlib CVE remediation; setup-go still installs
  # 1.26.x for build/test via go-version-file: go.mod. Linting at 1.25 is
  # safe because the source doesn't use any 1.26-only language features.
  go: "1.25"
linters:
  enable:
    - copyloopvar
    - durationcheck
    - forcetypeassert
    - makezero
    - misspell
    - nilerr
    - predeclared
    - unconvert
    - unparam
    - gosec
  settings:
    govet:
      disable:
        # The inline analyzer does not support type parameter inference yet,
        # which causes false positives on generic stdlib calls like slices.Contains.
        - inline
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - tools
      - third_party$
      - builtin$
      - examples$
      - internal/provider/provider_test.go
      - internal/provider/utils.go # Added to ignore unused function errors
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: true
  fix: true
formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - tools
      - third_party$
      - builtin$
      - examples$
